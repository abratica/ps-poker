<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/ps-icon-192.png">
<link rel="apple-touch-icon" href="icons/ps-apple-180.png">

<link rel="preload" href="brand/ps-poker-banner.webp" as="image">
<link rel="preload" href="fonts/cinzel-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/playfair-display-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/manrope-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>

</head>
<body>
<!-- Launch screen: shown once per app launch, fades out once the first view is on screen. -->
<style>
  #splash { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: #0E0E0E; color: #F7F4EE; transition: opacity .3s ease, transform .3s ease; }
  #splash.out { opacity: 0; transform: scale(1.03); pointer-events: none; }
  #splash .sp-banner { width: min(84vw, 420px); height: auto; animation: sp-in .4s ease-out both; }
  #splash .sp-word { font-family: "Cinzel", Georgia, serif; font-weight: 700; font-size: clamp(18px, 5.5vw, 26px); letter-spacing: .24em; margin-left: .24em; margin-top: 8px; color: #E9C65B; text-transform: uppercase; animation: sp-in .5s ease-out both; }
  @keyframes sp-in { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #splash .sp-banner { animation: none; } #splash { transition: opacity .2s; } #splash.out { transform: none; } }
</style>
<div id="splash" aria-hidden="true"><img class="sp-banner" src="brand/ps-poker-banner.webp" alt=""></div>
<script>
(function () {
  var el = document.getElementById("splash");
  var seen = false;
  try { seen = sessionStorage.getItem("psp-splash") === "1"; sessionStorage.setItem("psp-splash", "1"); } catch (e) {}
  if (seen) { el.remove(); return; }
  var start = Date.now(), MIN = 1600, MAX = 3500, done = false;
  function hide() {
    if (done) return; done = true;
    setTimeout(function () { el.classList.add("out"); setTimeout(function () { el.remove(); }, 350); }, Math.max(0, MIN - (Date.now() - start)));
  }
  setTimeout(hide, MAX);
  document.addEventListener("DOMContentLoaded", function () {
    var app = document.getElementById("view");
    if (app.children.length) return hide();
    new MutationObserver(function (m, o) { if (app.children.length) { o.disconnect(); hide(); } }).observe(app, { childList: true });
  });
})();
</script>

<header class="masthead">
  <a class="wordmark" href="#/" aria-label="PS Poker, home">
    <img class="wm-banner" src="brand/ps-poker-banner.webp" alt="PS Poker" width="192" height="64">
  </a>
  <p class="dateline" id="dateline">Hungry Horse study</p>
  <button class="theme-btn" type="button" aria-label="Change light or dark mode">
    <svg class="i-light" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g></svg>
    <svg class="i-dark" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
  </button>
</header>
<nav class="tabs" aria-label="Sections">
  <a href="#/" data-tab="home">Home</a>
  <a href="#/episodes" data-tab="episodes">Episodes</a>
  <a href="#/curriculum" data-tab="curriculum">Course</a>
</nav>

<main id="view" class="main" aria-live="polite"></main>

<script src="app.js?v=5"></script>
</body>
</html>
